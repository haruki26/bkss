pre-commit:
  parallel: true
  commands:
    format:
      root: crates/bkss-core
      glob: "crates/bkss-core/**/*.rs"
      run: cargo fmt -- {staged_files}
      stage_fixed: true
    lint:
      root: crates/bkss-core
      glob: "crates/bkss-core/**/*.rs"
      run: cargo clippy
      stage_fixed: true
