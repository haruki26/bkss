[package]
name = "bkss-integration"
version = "0.1.0"
edition = "2024"

[dependencies]
async-channel = { workspace = true }
async-io = "2.6.0"
bkss-core = { workspace = true }
futures-lite = "2.6.1"
gpui = { workspace = true, features = ["wayland"] }
chrono = "0.4.45"
libpulse-binding = "2.30.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.31.4"
udev = "0.9.3"
zbus = "5.19.0"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
