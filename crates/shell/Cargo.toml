[package]
name = "shell"
version = "0.1.0"
edition = "2024"
license.workspace = true

[[bin]]
name = "bkss"
path = "src/main.rs"

[dependencies]
async-io = "2.6.0"
bkss-core = { workspace = true }
bkss-integration = { workspace = true }
bkss-ui = { path = "../bkss-ui" }
chrono = "0.4.45"
futures-lite = "2.6.1"
gpui = { workspace = true, features = ["wayland"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zbus = "5.19.0"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
